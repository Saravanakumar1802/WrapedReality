# Weekly refresh: pulls new YouTube videos and captions, indexes new videos into
# moments with Gemini (free tier) (only new or changed videos: results are cached in
# cache/moments.json), IGDB covers and Steam hours, re-sorts the games, verifies
# everything, and commits the regenerated data. Your host
# (e.g. Vercel) redeploys automatically on the push.
# Add the keys under: GitHub repo → Settings → Secrets and variables → Actions.
name: Refresh game data

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build data
        run: npm run data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN: ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/generated public/data public/covers public/thumbs public/heroes public/logos cache  # cache/models is ignored
          git diff --cached --quiet || git commit -m "chore: weekly data refresh"
          git push
